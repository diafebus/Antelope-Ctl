# UCM2 profile for the Antelope Orion Studio Synergy Core.
#
# The USB audio function is class-compliant and exposes one 24-channel
# playback stream and one 24-channel capture stream.  Mixer, routing, gain,
# and output controls are not ALSA mixer controls on this device; they are
# controlled through the vendor HID interface by antelope-ctl/WebUI.

Comment "Antelope Orion Studio Synergy Core"

SectionUseCase."HiFi" {
	Comment "Stereo USB playback and capture"
	File "/USB-Audio/Antelope/OrionStudio-III-HiFi.conf"
}

# Keep the complete 24x24 stream available for JACK, PipeWire pro-audio, and
# other applications that need direct multichannel access.
Include.dhw.File "/common/directm.conf"
Macro.0.DirectUseCase { Id="Direct" PlaybackChannels=24 CaptureChannels=24 }
