# Stereo convenience devices for the Orion's 24-channel USB streams.
#
# These are raw USB stream lane pairs, not fixed physical connectors.  The
# Orion's HID routing matrix determines which hardware output or input each
# lane represents.  The Direct verb in OrionStudio-III.conf exposes all 24
# channels without splitting them.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "orion_studio_stereo_out"
			Direction Playback
			Format S24_3LE
			Channels 2
			HWChannels 24
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
			HWChannelPos14 FL
			HWChannelPos15 FR
			HWChannelPos16 FL
			HWChannelPos17 FR
			HWChannelPos18 FL
			HWChannelPos19 FR
			HWChannelPos20 FL
			HWChannelPos21 FR
			HWChannelPos22 FL
			HWChannelPos23 FR
		}
	}
	{
		SplitPCM {
			Name "orion_studio_stereo_in"
			Direction Capture
			Format S24_3LE
			Channels 2
			HWChannels 24
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
			HWChannelPos8 FL
			HWChannelPos9 FR
			HWChannelPos10 FL
			HWChannelPos11 FR
			HWChannelPos12 FL
			HWChannelPos13 FR
			HWChannelPos14 FL
			HWChannelPos15 FR
			HWChannelPos16 FL
			HWChannelPos17 FR
			HWChannelPos18 FL
			HWChannelPos19 FR
			HWChannelPos20 FL
			HWChannelPos21 FR
			HWChannelPos22 FL
			HWChannelPos23 FR
		}
	}
]

SectionDevice."Speaker" {
	Comment "USB playback 1-2"
	Value {
		PlaybackPriority 300
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "orion_studio_stereo_out"
		Direction Playback
		HWChannels 24
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

